</head><body>
<style>
/* Layout: colonne d'appli centrée, panneaux en verre dépoli sur fond ambiant flou, barre d'onglets flottante */
:root{
  --bg:#E9ECF1; --b1:rgba(255,178,140,.55); --b2:rgba(150,175,255,.50); --b3:rgba(150,215,195,.45);
  --glass:rgba(255,255,255,.46); --glass-strong:rgba(255,255,255,.70); --border:rgba(255,255,255,.82);
  --shadow:0 10px 30px rgba(30,40,60,.10), inset 0 1px 0 rgba(255,255,255,.9);
  --ink:#101217; --muted:#555B67; --sub:#363B45; --track:rgba(16,18,23,.085); --fill:#101217; --cta:#101217; --on-cta:#FFFFFF;
  --danger:#B42318; --good:#16794C; --scrim:rgba(20,24,32,.28);
  --work1:rgba(255,150,100,.70); --rest1:rgba(110,205,180,.65); --reps1:rgba(140,160,255,.65);
  --font:-apple-system,BlinkMacSystemFont,"Figtree",system-ui,"Segoe UI",sans-serif;
  --display:"Anton",Impact,"Arial Narrow Bold",sans-serif; --day:#7A4DFF; --on-day:#FFFFFF; --amb:.36;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0D12; --b1:rgba(255,140,90,.30); --b2:rgba(95,120,255,.30); --b3:rgba(60,180,150,.24);
  --glass:rgba(255,255,255,.075); --glass-strong:rgba(40,44,54,.72); --border:rgba(255,255,255,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14);
  --ink:#F5F6F8; --muted:#A0A6B2; --sub:#C7CBD3; --track:rgba(255,255,255,.11); --fill:#F5F6F8; --cta:#F5F6F8; --on-cta:#0B0D12;
  --danger:#FF8A80; --good:#6FD9A6; --scrim:rgba(0,0,0,.5);
  --work1:rgba(255,120,70,.30); --rest1:rgba(50,190,160,.28); --reps1:rgba(110,130,255,.30); --amb:.24; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0B0D12; --b1:rgba(255,140,90,.30); --b2:rgba(95,120,255,.30); --b3:rgba(60,180,150,.24);
  --glass:rgba(255,255,255,.075); --glass-strong:rgba(40,44,54,.72); --border:rgba(255,255,255,.15);
  --shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.14);
  --ink:#F5F6F8; --muted:#A0A6B2; --sub:#C7CBD3; --track:rgba(255,255,255,.11); --fill:#F5F6F8; --cta:#F5F6F8; --on-cta:#0B0D12;
  --danger:#FF8A80; --good:#6FD9A6; --scrim:rgba(0,0,0,.5);
  --work1:rgba(255,120,70,.30); --rest1:rgba(50,190,160,.28); --reps1:rgba(110,130,255,.30); --amb:.24; color-scheme:dark }

html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sub{color:var(--sub)} .small{font-size:.875rem} .xs{font-size:.78rem}

/* fond ambiant */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px)}
.ambient .a1{width:420px;height:420px;left:-140px;top:-120px;background:var(--day);opacity:var(--amb)}
.ambient .a2{width:380px;height:380px;right:-160px;top:30%;background:var(--b2)}
.ambient .a3{width:420px;height:360px;left:-60px;bottom:-140px;background:var(--b3)}

.wrap{position:relative;z-index:1;max-width:600px;margin:0 auto;padding-block:22px 120px;display:flex;flex-direction:column;gap:16px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(170%);backdrop-filter:blur(28px) saturate(170%);border:1px solid var(--border);box-shadow:var(--shadow)}
.card{border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.tight{padding:16px;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.label{font-size:.82rem;font-weight:600;color:var(--muted)}
.title-xl{font-family:var(--display);font-weight:400;font-size:2.5rem;line-height:1;letter-spacing:.01em;text-transform:uppercase}
.title-l{font-size:1.85rem;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.h-sec{font-size:1.05rem;font-weight:650}

/* en-tête */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 4px}
.lvl{width:50px;height:50px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);flex:none}
.lvl small{font-size:.58rem;font-weight:700;color:var(--muted);line-height:1;letter-spacing:.06em}
.lvl b{font-size:1.15rem;line-height:1.1}
.lvl[aria-current="page"]{background:var(--fill);color:var(--on-cta)}
.sync{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted)} .sync.ok i{background:var(--good)} .sync.err i{background:var(--danger)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:.95rem;color:var(--ink);text-decoration:none;
  background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid var(--border);box-shadow:var(--shadow)}
.btn.primary{background:var(--day);color:var(--on-day);border-color:transparent;box-shadow:0 8px 24px rgba(0,0,0,.14)}
.btn.big{min-height:54px;font-size:1.05rem;width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:.85rem}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font-weight:600;text-decoration:underline;text-decoration-color:var(--muted);text-underline-offset:3px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;padding:0}

.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{flex:1;border:0;background:transparent;min-height:38px;padding:0 12px;border-radius:999px;font-weight:600;font-size:.88rem;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;background:var(--track);color:var(--sub);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--day)}

/* série */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:.72rem;font-weight:600;color:var(--muted)}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week span{width:100%;max-width:36px;aspect-ratio:1;border-radius:50%;background:var(--track)}
.week .on span{background:var(--fill)} .week .today{color:var(--ink)} .week .today span{background:transparent;box-shadow:inset 0 0 0 2px var(--fill)}
.week .miss span{background:transparent;box-shadow:inset 0 0 0 1px var(--track)}

.stat b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted)}

/* listes */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--track)}
.list li:last-child{border-bottom:0}
.list .dose{font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.blk-t{margin-top:6px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}

/* programme */
.weeks{display:flex;flex-direction:column;gap:6px}
.wk{display:grid;grid-template-columns:4.6rem 1fr 1fr;gap:6px;align-items:center}
.wk .lbl{font-size:.82rem;font-weight:600;color:var(--muted)}
.sbtn{min-height:40px;border-radius:999px;border:1px solid var(--border);background:var(--track);font-weight:600;font-size:.85rem;color:var(--sub)}
.sbtn.done{background:var(--fill);color:var(--on-cta);border-color:transparent}
.sbtn.next{box-shadow:inset 0 0 0 2px var(--fill);background:transparent;color:var(--ink)}
.sbtn[aria-pressed="true"]{outline:2px solid var(--muted);outline-offset:2px}
.phase-h{font-size:.9rem;font-weight:650;margin-top:8px}

/* formulaires */
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted);min-width:0}
input[type=number],input[type=text],input[type=search],input[type=password],input[type=time],select,textarea{width:100%;min-width:0;background:var(--track);border:1px solid var(--border);border-radius:14px;padding:11px 13px;font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:90px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}

/* progrès */
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:4px;width:max-content}
.heat i{width:13px;height:13px;border-radius:4px;background:var(--track)}
.heat i.on{background:var(--day)} .heat i.today{box-shadow:inset 0 0 0 2px var(--muted)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.trophy{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:4px}
.trophy .m{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--track);color:var(--muted)}
.trophy.got .m{background:var(--fill);color:var(--on-cta)}
.trophy:not(.got){opacity:.55}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th,table.t td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--track);font-size:.9rem}
table.t th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto}

/* repas */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.rcard{border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.rcard h3{font-size:1.1rem}
.star{border:0;background:none;font-size:1.35rem;line-height:1;color:var(--muted);min-width:40px;min-height:40px;padding:0}
.star.on{color:var(--ink)}
.day{border-radius:22px;padding:14px;display:grid;grid-template-columns:6rem 1fr 1fr;gap:10px;align-items:start}
.day.today{box-shadow:var(--shadow),inset 0 0 0 2px var(--fill)}
.day .dn{font-weight:650}
.slot{display:flex;flex-direction:column;gap:5px;min-width:0}
.slot select{padding:9px 10px;font-size:15px}
.slot .pp{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.slot .pp input{width:3.8rem;padding:5px 8px;border-radius:10px}
@media (max-width:560px){ .day{grid-template-columns:1fr 1fr} .day .dh{grid-column:1 / -1;display:flex;justify-content:space-between;gap:8px;align-items:baseline} }
.shop{list-style:none;margin:0;padding:0}
.shop li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--track)}
.shop li:last-child{border-bottom:0}
.shop label{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.shop input[type=checkbox]{width:22px;height:22px;accent-color:var(--fill);flex:none}
.shop li.done .nm{text-decoration:line-through;color:var(--muted)}
.shop .q{margin-left:auto;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}

/* barre d'onglets flottante */
.tabbar{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(440px,calc(100% - 2 * max(16px,env(safe-area-inset-left,0px))));
  height:66px;border-radius:33px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:0 7px;background:var(--glass-strong)}
.tabbar a{height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.66rem;font-weight:600}
.tabbar a[aria-current="page"]{color:var(--on-day);background:var(--day)}
.tabbar svg{width:22px;height:22px}

/* feuille */
.sheet-bg{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:620px;max-height:92%;overflow:auto;border-radius:30px 30px 0 0;background:var(--glass-strong);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border:1px solid var(--border);
  padding:22px max(20px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){ .sheet-bg{align-items:center} .sheet{border-radius:30px} }
.sheet ol,.sheet ul{margin:0;padding-left:1.2rem}

/* lecteur de séance */
.player{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.player .ambient{position:absolute}
.player .ambient i{transition:background-color .6s}
.player.ph-work .a1{background:var(--day);opacity:calc(var(--amb) + .2)} .player.ph-work .a3{background:var(--day);opacity:var(--amb)}
.player.ph-rest .a1{background:var(--rest1)} .player.ph-rest .a3{background:var(--rest1)}
.player.ph-reps .a1{background:var(--reps1)} .player.ph-reps .a3{background:var(--reps1)}
.pl{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:14px;max-width:520px;width:100%;margin:0 auto}
.pl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{padding:8px 14px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--sub)}
.pl-prog{height:4px;border-radius:2px;background:var(--track);overflow:hidden}
.pl-prog i{display:block;height:100%;background:var(--fill);transition:width .3s}
.pl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;min-height:0}
.pl-phase{font-size:.8rem;font-weight:700;letter-spacing:.18em;color:var(--muted)}
.dial{position:relative;width:min(230px,54vw);aspect-ratio:1;border-radius:50%}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .big{font-size:clamp(3.8rem,19vw,5.6rem);font-weight:300;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.pl-ex{font-size:clamp(1.6rem,7vw,2rem);font-weight:700;letter-spacing:-.02em}
.pl-cue{font-size:.95rem;color:var(--sub);max-width:22rem}
.pl-next{border-radius:20px;padding:13px 18px;display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.pl-ctl{display:flex;justify-content:center;align-items:center;gap:26px}
.pl-ctl .side{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pl-ctl .main{width:84px;height:84px;border-radius:50%;border:0;background:var(--day);color:var(--on-day);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pl-ctl .main.wide{width:auto;min-width:180px;padding:0 28px;border-radius:42px;font-size:1.1rem;font-weight:700}
.fb{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.fb button{min-height:52px;border-radius:999px;font-weight:600;color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;padding:11px 18px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:min(92vw,460px);text-align:center;background:var(--glass-strong)}
.note{font-size:.83rem;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600}
.thinking::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--fill);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .thinking::before{animation:none} .player .ambient i,.pl-prog i{transition:none} }
.figwrap{height:min(108px,13vh);display:flex;justify-content:center}
.fig{height:100%;width:auto;overflow:visible}
.fig line{stroke:var(--ink);stroke-width:4.4;stroke-linecap:round}
.fig line.far{opacity:.42}
.fig line.gr{stroke:var(--track);stroke-width:2;opacity:1}
.fig circle{fill:var(--ink)}
.sheet .figwrap{height:150px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.photos button{padding:0;border:0;border-radius:14px;overflow:hidden;aspect-ratio:3/4;background:var(--track);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:6px;bottom:6px;font-size:.66rem;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0;display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);text-align:center}
.cmp img{width:100%;border-radius:14px}
.cat-h{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 4px 0}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--border);background:var(--track);border-radius:999px;min-height:38px;padding:0 14px;font-weight:600;font-size:.86rem;color:var(--sub)}
.chipsel button[aria-pressed="true"]{background:var(--fill);color:var(--on-cta);border-color:transparent}
details.card>summary{list-style:none;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
.exl{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;text-decoration:underline;text-decoration-color:var(--track);text-underline-offset:3px}
.reps-adj{display:flex;align-items:center;gap:14px;font-size:.9rem;color:var(--sub)}
.reps-adj button{width:40px;height:40px;border-radius:50%;font-size:1.3rem;font-weight:600;color:var(--ink);padding:0}
.grid30{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}

function linearize(plan){
  const st=[{ty:'prep',secs:10,lab:'Prépare-toi',met:2.5}];

    const last=bi===plan.blocks.length-1;
    if(b.type==='circuit'){ const met=b.t==='Retour au calme'?2.3:4; b.items.forEach(([ex,s])=>st.push({ty:'work',ex,secs:s,lab:b.t,met})); if(!last&&plan.blocks[bi+1].type==='strength') st.push({ty:'rest',secs:20,lab:'Transition',met:2.5}); }
    else if(b.type==='strength'){ b.items.forEach(it=>{ for(let s=1;s<=it.sets;s++){ st.push(it.secs?{ty:'work',ex:it.ex,secs:it.secs,lab:'Série '+s+'/'+it.sets,met:4}:{ty:'reps',ex:it.ex,reps:it.reps,lab:'Série '+s+'/'+it.sets,met:5}); st.push({ty:'rest',secs:it.rest,lab:'Récupération',met:2.5}); } }); }
    else if(b.type==='tabata'){ const pv=st[st.length-1]; if(pv.ty!=='rest'&&pv.ty!=='prep') st.push({ty:'rest',secs:20,lab:'Prépare le bloc',met:2.5});
      for(let r=0;r<b.rounds;r++){ st.push({ty:'work',ex:r%2?b.b:b.a,secs:b.work,lab:b.t+' · round '+(r+1)+'/'+b.rounds,met:8.5,tab:true}); if(r<b.rounds-1) st.push({ty:'rest',secs:b.rest,lab:b.t+' · repos',met:5}); }
      if(!last) st.push({ty:'rest',secs:b.after||60,lab:'Récupère',met:3}); }
    else if(b.type==='emom'){ for(let m=0;m<b.minutes;m++){ const [ex,reps]=b.items[m%b.items.length]; st.push({ty:'work',ex,secs:60,lab:'EMOM · minute '+(m+1)+'/'+b.minutes,met:6.5,target:reps+' '+EX[ex].n.toLowerCase()}); } }
    else if(b.type==='intervals'){ b.steps.forEach(([ex,secs],i)=>{ st.push({ty:'work',ex,secs,lab:b.t+' · '+(i+1)+'/'+b.steps.length,met:7.5,tab:true}); if(i<b.steps.length-1) st.push({ty:'rest',secs:b.rest,lab:b.t+' · repos',met:3.5}); }); if(!last) st.push({ty:'rest',secs:30,lab:'Récupère',met:3}); }

  while(st.length&&st[st.length-1].ty==='rest') st.pop();
  st.forEach((x,i)=>{ if(x.ty==='rest'||x.ty==='prep') x.next=st.slice(i+1).find(y=>y.ty==='work'||y.ty==='reps'); });

}

function parseIng(line){ const m=String(line).trim().match(/^(\d+(?:[.,]\d+)?|½|¼|¾)\s*(.*)$/); if(!m) return {q:null,u:'',n:String(line).trim()};
  let q=({'½':.5,'¼':.25,'¾':.75})[m[1]]??parseFloat(m[1].replace(',','.')), rest=m[2], u='';
  for(const un of UNITS){ const lo=rest.toLowerCase(); if(lo===un||lo.startsWith(un+' ')){ u=un; rest=rest.slice(un.length).trim(); break; } }
  rest=rest.replace(/^(de |d’|d')/i,'').trim();
  if(u==='kg'){q*=1000;u='g';} if(u==='l'){q*=1000;u='ml';} if(u==='cl'){q*=10;u='ml';}
  if(/^c\. à s|cuill[eè]res? à soupe|^cs$/.test(u)) u='c. à soupe'; if(/^c\. à c|cuill[eè]res? à café|^cc$/.test(u)) u='c. à café';
  return {q,u,n:rest||line}; }

  const r=q>=20?Math.round(q):Math.round(q*10)/10; const pl=r>1&&/^(boîte|tranche|gousse|pot|sachet|poignée|pincée|tasse)$/.test(u)?u+'s':u; return String(r).replace('.',',')+(pl?' '+pl:''); }

    (r.ing||[]).forEach(line=>{ const p=parseIng(line), key=p.n.toLowerCase()+'|'+p.u; const cur=map.get(key)||{n:p.n,u:p.u,q:0,cnt:0,from:new Set()};
      if(p.q!=null) cur.q+=p.q*f; else cur.cnt++; cur.from.add(r.name); map.set(key,cur); }); }));

function suggestWeek(){ const plats=allRecipes().filter(r=>recipeCat(r)==='plat'); if(!plats.length) return 0;
  const words=r=>new Set((r.ing||[]).map(l=>parseIng(l).n.toLowerCase().split(/[ ,]/)[0]).filter(w=>w.length>2));
  const used=new Map(), basket=new Set(); let n=0, left=null;
  weekDays(PLAN_OFF).forEach(d=>['d','s'].forEach(sl=>{ const k=d+'|'+sl; if(D.r.plan[k]) return;
    if(left&&left.n>0){ D.r.plan[k]={r:left.r.id,p:0}; left.n--; n++; return; }
    let best=null,bs=-1e9; for(const r of plats){ const w=words(r); let ov=0; w.forEach(x=>{ if(basket.has(x)) ov++; }); const sc=ov*2+(isFav(r.id)?3:0)-(used.get(r.id)||0)*6+(Math.random()*1.5); if(sc>bs){bs=sc;best=r;} }

function startPlayer(plan,meta){

  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); AC.resume&&AC.resume(); }catch(e){}

    try{ const x=await PH.get(id); if(!x) throw 0; const first=PHOTOS&&PHOTOS[0];
      openSheet(`<div class="between"><h2 class="title-l">${fmtDate(x.d)}</h2><button class="icon-btn glass" data-act="closeSheet" aria-label="Fermer">${svg('x',16)}</button></div><img src="${esc(x.data)}" alt="Photo du ${fmtDate(x.d)}" style="width:100%;border-radius:20px">
        <div class="row">${first&&first.id!==id?`<button class="btn" data-act="cmpPhoto" data-id="${esc(id)}">Comparer avec la première</button>`:''}<button class="btn danger" data-act="delPhoto" data-id="${esc(id)}" data-confirm>Supprimer</button></div>`);
    }catch(e){ closeSheet(); toast('Photo introuvable ou pas de connexion.'); } },
  async cmpPhoto(b){ try{ const [a,c]=await Promise.all([PH.get(PHOTOS[0].id),PH.get(b.dataset.id)]);
    openSheet(`<div class="between"><h2 class="title-l">Avant / maintenant</h2><button class="icon-btn glass" data-act="closeSheet" aria-label="Fermer">${svg('x',16)}</button></div><div class="cmp"><figure><img src="${esc(a.data)}" alt="Première photo">${fmtDate(a.d)}</figure><figure><img src="${esc(c.data)}" alt="Photo récente">${fmtDate(c.d)}</figure></div>`); }catch(e){ toast('Comparaison impossible pour le moment.'); } },
  async delPhoto(b){ try{ await PH.del(b.dataset.id); closeSheet(); PHOTOS=null; loadPhotos(); toast('Photo supprimée.'); }catch(e){ toast('Suppression impossible pour le moment.'); } },
  toggleMusic(){ D.s.keepMusic=!D.s.keepMusic; save('s'); render(); }, toggleTempo(){ D.s.tempo=!D.s.tempo; save('s'); render(); },
  async remind(){ const t=($('#remind_t')?.value||'18:30'); D.s.remind=t; save('s'); const [H,M]=t.split(':'); const d=new Date(); if(d.getHours()*60+d.getMinutes()>=(+H)*60+(+M)) d.setDate(d.getDate()+1);
    const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Elan//FR','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:elan-rappel-'+Date.now()+'@elan','DTSTAMP:'+stamp,'DTSTART:'+iso(d).replace(/-/g,'')+'T'+H+M+'00','DURATION:PT15M','RRULE:FREQ=DAILY',
      'SUMMARY:Élan · ton Tabata du jour','DESCRIPTION:Quelques minutes suffisent pour garder ta série.','URL:https://lampadwair.github.io/elan/','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Ton Tabata t’attend','TRIGGER:PT0M','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    const blob=new Blob([ics],{type:'text/calendar'});
    if(window.claude){ try{ const dl=await claude.use('downloads'); if(!dl) throw 0; await dl.save({filename:'elan-rappel.ics',data:blob}); toast('Ouvre le fichier pour ajouter le rappel à ton calendrier.'); }catch(e){ if(!(e&&e.code==='cancelled')) toast('Fais-le plutôt depuis l’appli iPhone.'); } return; }
    const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download='elan-rappel.ics'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000);
    toast('Ajoute l’événement à ton calendrier : il sonnera chaque jour à '+t+'.'); },
  async shareList(){ const items=shopping(PLAN_OFF), wk=weekDays(PLAN_OFF)[0], rest=items.filter(i=>!D.r.checked[wk+'|'+i.key]); if(!rest.length){ toast('Tout est déjà coché.'); return; }
    const text='Courses Élan (semaine du '+fmtDate(wk)+')\n'+AISLE_ORDER.map(a=>{ const L=rest.filter(i=>aisleOf(i.n)===a); return L.length?'\n'+a+'\n'+L.map(i=>'• '+i.n+(i.qty?' : '+i.qty:'')).join('\n'):''; }).join('');
    if(navigator.share&&!window.claude){ try{ await navigator.share({title:'Liste de courses',text}); return; }catch(e){ if(e&&e.name==='AbortError') return; } }
    try{ await navigator.clipboard.writeText(text); toast('Liste copiée : colle-la dans un message.'); }
    catch(e){ openSheet(`<div class="between"><h2 class="title-l">Liste de courses</h2><button class="icon-btn glass" data-act="closeSheet" aria-label="Fermer">${svg('x',16)}</button></div><textarea rows="12" readonly>${esc(text)}</textarea><p class="xs muted">Sélectionne le texte et copie-le.</p>`); } },
  startCustom(){ const c={a:$('#tb_a').value,b:$('#tb_b').value,blocks:clamp(num('tb_blocks')||1,1,6),work:clamp(num('tb_work')||20,10,60),rest:clamp(num('tb_rest')||10,5,60),rounds:clamp(num('tb_rounds')||8,2,12)};
    LS.set('elan_tab',JSON.stringify(c)); startPlayer({k:'libre',title:'Tabata libre',blocks:[{t:'Échauffement',type:'circuit',items:[['jj',30],['rot_bras',30]]},...[...Array(c.blocks)].map((_,i)=>({t:'Bloc '+(i+1)+'/'+c.blocks,type:'tabata',a:c.a,b:c.b,rounds:c.rounds,work:c.work,rest:c.rest,after:60}))]},{k:'libre'}); },
  addWeight(){ const kg=num('kg'); if(!kg||kg<30||kg>200){ toast('Entre un poids en kg, par ex. 60,4.'); return; } const d=iso(); D.s.weights=D.s.weights.filter(x=>x.d!==d); D.s.weights.push({d,kg:Math.round(kg*10)/10}); D.s.weights.sort((a,b)=>a.d.localeCompare(b.d)); save('s'); render(); toast('Pesée enregistrée.'); },
  undoLast(){ const x=D.s.sessions.pop(); if(x&&isForce(x.k)) D.s.adj=clamp(D.s.adj-(x.fb||0),-3,3); save('s'); render(); toast('Dernière séance supprimée.'); },
  toggleVoice(){ D.s.voice=!D.s.voice; save('s'); if(P) renderPlayer(); else render(); },
  plPause(){ if(!P.endAt) return; if(P.paused){ P.endAt=Date.now()+P.left; P.pausedMs+=Date.now()-P.pauseAt; P.paused=false; } else { P.left=P.endAt-Date.now(); P.pauseAt=Date.now(); P.paused=true; } renderPlayer(); },
  plNext(){ enter(P.i+1); }, plPrev(){ let i=P.i-1; while(i>0&&P.steps[i].ty==='rest') i--; enter(Math.max(0,i)); },
  plQuit(){ if(P.quitArm){ closePlayer(); return; } P.quitArm=true; renderPlayer(); setTimeout(()=>{ if(P&&P.quitArm){ P.quitArm=false; if(!P.finished) renderPlayer(); } },3000); },
  plDiscard(){ closePlayer(); }, fb(b){ logSession(b.dataset.v); },
  rtab(b){ REPAS_TAB=b.dataset.id; LS.set('elan_rt',REPAS_TAB); render(); },
  planOff(b){ PLAN_OFF=+b.dataset.o; render(); },
  rfilter(b){ RFILTER=b.dataset.id; render(); },
  fav(b){ const id=b.dataset.id; D.r.favs=isFav(id)?D.r.favs.filter(x=>x!==id):[...D.r.favs,id]; save('r'); render(); if(!$('#sheet').hidden){ const r=recipe(id); if(r) openSheet(recipeSheet(r)); } },
  openRecipe(b){ const r=recipe(b.dataset.id); if(r) openSheet(recipeSheet(r)); },
  closeSheet(){ closeSheet(); },
  newRecipe(){ openSheet(editSheet()); }, importRecipe(){ openSheet(importSheet()); },
  editRecipe(b){ openSheet(editSheet(recipe(b.dataset.id))); },
  copyRecipe(b){ const r=clone(recipe(b.dataset.id)); r.id='u'+Date.now().toString(36); r.name=r.name+' (ma version)'; D.r.recipes.unshift(r); save('r'); openSheet(editSheet(r)); render(); },
  saveRecipe(b){ const name=$('#e_name').value.trim(); if(!name){ toast('Donne un nom à la recette.'); return; }
    const r={id:b.dataset.id||('u'+Date.now().toString(36)),name:name.slice(0,120),portions:clamp(num('e_por')||1,1,12),time:num('e_time')||'',kcal:num('e_kcal')||'',cat:$('#e_cat').value,
      ing:$('#e_ing').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,40),steps:$('#e_steps').value.trim().slice(0,4000),tags:$('#e_tags').value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,6),src:$('#e_src').value.trim().slice(0,80)};
    const i=D.r.recipes.findIndex(x=>x.id===r.id); if(i>=0) D.r.recipes[i]=r; else { D.r.recipes.unshift(r); if(!isFav(r.id)) D.r.favs.push(r.id); }
    save('r'); openSheet(recipeSheet(r)); render(); toast('Recette enregistrée.'); },
  delRecipe(b){ const id=b.dataset.id; D.r.recipes=D.r.recipes.filter(x=>x.id!==id); D.r.favs=D.r.favs.filter(x=>x!==id); for(const k of Object.keys(D.r.plan)) if(D.r.plan[k].r===id) delete D.r.plan[k]; save('r'); closeSheet(); render(); toast('Recette supprimée.'); },
  addToPlan(b){ const d=$('#ap_day').value, sl=$('#ap_slot').value; D.r.plan[d+'|'+sl]={r:b.dataset.id,p:clamp(num('ap_p')||1,1,12)}; prunePlan(); save('r'); closeSheet(); render(); toast('Ajouté au '+(sl==='d'?'déjeuner':'dîner')+' du '+fmtDate(d)+'.'); },
  fillFavs(){ const favs=allRecipes().filter(r=>isFav(r.id)&&recipeCat(r)==='plat'); if(!favs.length){ toast('Ajoute d’abord des recettes en favoris (étoile).'); return; } let j=0,n=0;
    weekDays(PLAN_OFF).forEach(d=>['d','s'].forEach(sl=>{ const k=d+'|'+sl; if(!D.r.plan[k]){ const r=favs[j++%favs.length]; D.r.plan[k]={r:r.id,p:1}; n++; } })); prunePlan(); save('r'); render(); toast(n?n+' repas ajoutés.':'Ta semaine est déjà remplie.'); },
  clearWeek(){ weekDays(PLAN_OFF).forEach(d=>['d','s'].forEach(sl=>delete D.r.plan[d+'|'+sl])); save('r'); render(); },
  addExtra(){ const v=$('#extra').value.trim(); if(!v) return; D.r.extra.push({id:Date.now().toString(36),n:v.slice(0,80),w:weekDays(PLAN_OFF)[0]}); save('r'); render(); setTimeout(()=>$('#extra')?.focus(),0); },
  delExtra(b){ D.r.extra=D.r.extra.filter(x=>x.id!==b.dataset.id); save('r'); render(); },
  uncheckAll(){ const wk=weekDays(PLAN_OFF)[0]; for(const k of Object.keys(D.r.checked)) if(k.startsWith(wk+'|')) delete D.r.checked[k]; save('r'); render(); },
  runImport(){ runImport(); }, stopImport(){ IMPORT_CTL?.abort(); },
  copyData(){ const txt=JSON.stringify({app:'elan',v:1,s:D.s,r:D.r}); const ta=$('#xfer');
    const fallback=()=>{ ta.value=txt; ta.focus(); ta.select(); toast('Sélectionné : copie-le avec Copier.'); };
    try{ navigator.clipboard.writeText(txt).then(()=>toast('Données copiées. Colle-les dans l’autre version.'),fallback); }catch(e){ fallback(); } },
  pasteData(){ let o; try{ o=JSON.parse($('#xfer').value); }catch(e){ toast('Ces données ne sont pas lisibles. Recopie-les en entier.'); return; }
    if(!o||o.app!=='elan'||!o.s||!o.r){ toast('Ce ne sont pas des données Élan.'); return; }
    D.s=norm('s',o.s); D.r=norm('r',o.r); save('s'); save('r'); render(); toast('Données importées.'); },
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b){ if(e.target.id==='sheet') closeSheet(); return; }
  if(b.hasAttribute('data-confirm')&&!b.dataset.armed){ b.dataset.armed='1'; const t=b.innerHTML; b.textContent='Confirmer ?'; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.innerHTML=t; } },3000); return; }
  const f=ACT[b.dataset.act]; if(f){ e.preventDefault(); f(b); }
});
document.addEventListener('change',e=>{ const el=e.target, k=el.dataset.chg;
  if(el.id==='why'){ D.s.why=el.value.slice(0,140); save('s'); return; }
  if(el.id==='remind_t'){ D.s.remind=el.value||'18:30'; save('s'); if(D.s.pushOn&&MODE==='supa') pushSub().then(sub=>sub&&savePushRow(sub)).catch(()=>{}); return; }
  if(el.id==='ph_in'){ addPhoto(el.files&&el.files[0]); el.value=''; return; }
  if(el.id==='set_name'){ D.s.name=el.value.trim().slice(0,30); save('s'); return; }
  if(k==='plan'){ if(el.value){ const prev=D.r.plan[el.dataset.key]; D.r.plan[el.dataset.key]={r:el.value,p:prev?.p??1}; } else delete D.r.plan[el.dataset.key]; prunePlan(); save('r'); render(); }
  if(k==='portions'){ const e2=D.r.plan[el.dataset.key]; if(e2){ const v=parseInt(el.value); e2.p=clamp(isNaN(v)?1:v,0,12); save('r'); } }
  if(k==='check'){ if(el.checked) D.r.checked[el.dataset.key]=true; else delete D.r.checked[el.dataset.key]; save('r'); render(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='rsearch'){ RSEARCH=e.target.value; const pos=e.target.selectionStart; render(); const s=$('#rsearch'); s.focus(); try{s.setSelectionRange(pos,pos)}catch(_){} } });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet();
  if(P&&!P.finished&&e.code==='Space'&&!e.target.matches('input,textarea,select,button')){ e.preventDefault(); const st=P.steps[P.i]; st.ty==='reps'?ACT.repDone():ACT.plPause(); }
  if(e.key==='Enter'&&e.target.id==='extra') ACT.addExtra(); });
window.addEventListener('hashchange',route);
if(!window.claude&&'serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
VIEW=VIEWS.some(v=>v[0]===location.hash.slice(1))?location.hash.slice(1):'today';
init();
</script>
